services:
  app:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: e-libra
      DB_USERNAME: root
      DB_PASSWORD: root
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: elibra-local
      REVERB_APP_KEY: local-reverb-key
      REVERB_APP_SECRET: local-reverb-secret
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    ports:
      - '8000:8000'
    depends_on:
      - db
      - reverb
    command: php -S 0.0.0.0:8000 -t public

  reverb:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: elibra-local
      REVERB_APP_KEY: local-reverb-key
      REVERB_APP_SECRET: local-reverb-secret
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    ports:
      - '8080:8080'
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - db

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e-libra
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    # Do not bind host :3306 — often already used by system MySQL.
    # App reaches DB via Docker network as host `db` port 3306.
    # Optional host access: uncomment → '3307:3306'
    # ports:
    #   - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

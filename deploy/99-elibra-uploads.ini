; Large PDF uploads for e-libra (nginx + php8.3-fpm)
; Install on server:
;   sudo cp deploy/99-elibra-uploads.ini /etc/php/8.3/fpm/conf.d/99-elibra-uploads.ini
;   sudo systemctl reload php8.3-fpm

upload_max_filesize = 512M
post_max_size = 520M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

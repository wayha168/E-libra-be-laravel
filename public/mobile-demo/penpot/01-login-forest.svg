<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="E-Libra Login Forest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF8F1"/>
      <stop offset="100%" stop-color="#D9F2E1"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5DCB78"/>
      <stop offset="100%" stop-color="#248A41"/>
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1B6B33" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="40" fill="url(#bg)"/>
  <circle cx="40" cy="20" r="120" fill="#9FE0B4" opacity="0.55" filter="url(#blur40)"/>
  <circle cx="340" cy="180" r="90" fill="#2FAD52" opacity="0.18" filter="url(#blur40)"/>
  <rect x="157" y="72" width="76" height="76" rx="24" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="195" y="190" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B6B33">E-Libra</text>
  <text x="195" y="220" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="15" fill="#4D6656">Your school library, anywhere.</text>
  <rect x="16" y="260" width="358" height="520" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.65" filter="url(#shadow)"/>
  <text x="38" y="310" font-family="Outfit, Arial, sans-serif" font-size="24" font-weight="700" fill="#14261B">Welcome back</text>
  <text x="38" y="338" font-family="Outfit, Arial, sans-serif" font-size="14" fill="#4D6656">Sign in to access your school library.</text>
  <rect x="38" y="360" width="314" height="44" rx="14" fill="#2FAD52" fill-opacity="0.08" stroke="#248A41" stroke-opacity="0.14"/>
  <circle cx="280" cy="382" r="12" fill="url(#brand)"/>
  <circle cx="308" cy="382" r="12" fill="#1F91BC"/>
  <circle cx="336" cy="382" r="12" fill="#E07A3E"/>
  <text x="54" y="386" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" fill="#4D6656">Theme</text>
  <rect x="38" y="422" width="314" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.45" stroke="#248A41" stroke-opacity="0.18"/>
  <text x="54" y="454" font-family="Outfit, Arial, sans-serif" font-size="14" fill="#7A9484">alex@greenvalley.edu</text>
  <rect x="38" y="488" width="314" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.45" stroke="#248A41" stroke-opacity="0.18"/>
  <text x="54" y="520" font-family="Outfit, Arial, sans-serif" font-size="14" fill="#7A9484">""""""""""</text>
  <rect x="38" y="568" width="314" height="52" rx="16" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="195" y="600" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Sign in</text>
  <text x="195" y="650" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" fill="#4D6656">New here? Create account</text>
</svg>
